# Local development stack. Credentials here are fixed development values and are
# deliberately not read from .env, so `docker compose up` works on a fresh clone and
# nobody is tempted to point this file at a real account.
name: asofline

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: asofline
      MINIO_ROOT_PASSWORD: asofline-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the warehouse bucket, then exits. Everything downstream waits on
  # service_completed_successfully, so a failed bucket creation stops the stack
  # instead of surfacing later as a confusing catalog error.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 asofline asofline-dev-secret &&
      mc mb --ignore-existing local/asofline-warehouse &&
      mc ls local
      "

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      CATALOG_WAREHOUSE: s3://asofline-warehouse/
      # S3FileIO rather than hadoop-aws. It removes the entire hadoop-aws / aws-sdk
      # version conflict class, which is the usual reason a local Iceberg stack does not
      # come up on the first try.
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: asofline
      AWS_SECRET_ACCESS_KEY: asofline-dev-secret
      AWS_REGION: us-east-1
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8181/v1/config?warehouse=s3://asofline-warehouse/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Topics are created explicitly rather than on first produce. KAFKA_AUTO_CREATE_TOPICS
  # is off because an auto-created topic gets the broker default partition count, and a
  # consumer group's parallelism silently becoming 1 is not a failure anyone notices.
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    # One command per line. A folded block keeps the newline before any line that is
    # more indented than the first, which silently split these into argument-less calls.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
            --create --if-not-exists --topic "$$1" --partitions 6 --replication-factor 1
        }
        create engagement_events
        create feature_logs
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe

  redis:
    image: redis:8-alpine
    # Persistence off on both channels. An RDB fork or an AOF rewrite mid-benchmark
    # shows up as a latency spike that has nothing to do with the code being measured,
    # and this store holds only derived state that the offline path can rebuild.
    # noeviction so a full instance fails writes loudly rather than silently dropping
    # features, which would surface as unexplained skew rather than as an error.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  minio-data:
  kafka-data:
