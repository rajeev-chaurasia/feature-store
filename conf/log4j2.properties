# Spark 4 defaults to JSON structured logging, which renders a single analysis error as
# several thousand characters of escaped stack trace. This restores plain text.
# spark.log.structuredLogging.enabled is not enough on its own: log4j is configured from
# the packaged defaults at class-load time, before SparkConf is read.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %p %c{1}: %m%n

logger.spark.name = org.apache.spark
logger.spark.level = warn
logger.iceberg.name = org.apache.iceberg
logger.iceberg.level = warn
# The banner Spark prints when it cannot resolve a hostname, once per session.
logger.utils.name = org.apache.spark.util.Utils
logger.utils.level = error
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = error
